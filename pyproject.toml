[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madoop"
version = "1.3.2"
description="A light weight MapReduce framework for education."
license = {file = "LICENSE"}
authors = [
    {name = "Andrew DeOrio", email = "awdeorio@umich.edu"}
]
readme = "README.md"
keywords = [
  "madoop", "Hadoop", "MapReduce", "Michigan Hadoop", "Hadoop Streaming"
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

[project.urls]
repository = "https://github.com/eecs485staff/madoop/"
documentation = "https://github.com/eecs485staff/madoop/blob/develop/README_Hadoop_Streaming.md#hadoop-streaming-in-python"

[project.scripts]
madoop = "madoop.__main__:main"

[project.optional-dependencies]
dev = [
    "build",
    "check-manifest",
    "pytest",
    "pytest-cov",
    "ruff",
    "tox",
    "twine",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["madoop*"]

[tool.ruff.lint]
# Specify which groups of lint rules to use.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "D",   # pydocstyle
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "PL",  # pylint subset
    "RET", # flake8-return
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
]
# Ignore specific rule violations.  See https://docs.astral.sh/ruff/rules.
ignore = [
    # Disable the following two rules because they conflict with other rules.
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)

    # Disable the following rules because they're made redundant by the formatter.
    "W191",  # tab-indentation
    "E111",  # indentation-with-invalid-multiple
    "E114",  # indentation-with-invalid-multiple-comment
    "E117",  # over-indented
    "D206",  # indent-with-spaces
    "D300",  # triple-single-quotes
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
# `utils` is the shared test-helper module (tests/utils.py).  Pin it as
# first-party so it's grouped separately from third-party imports like
# pytest, instead of relying on ruff's implicit detection.
known-first-party = ["utils"]

[tool.ruff.lint.per-file-ignores]
# Plain numeric literals in test assertions are idiomatic, not a code smell.
# Ignore PLR2004 in test files.
"test_*.py" = ["PLR2004"]

