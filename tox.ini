# Run against whatever Python 3 interpreter is active.  In CI the version is
# chosen by the GitHub Actions matrix (the floor and the latest minor); locally
# it's your system python3.
[tox]
envlist = py3

# Run unit tests
[testenv]
setenv =
  PYTHONPATH = {toxinidir}
allowlist_externals =
  diff
extras = dev
commands =
  diff -r madoop/example/input tests/testdata/word_count/input/
  diff -r madoop/example/map.py tests/testdata/word_count/map.py
  diff -r madoop/example/reduce.py tests/testdata/word_count/reduce.py
  ruff check madoop tests
  ruff format --check madoop tests
  check-manifest
  pytest -vvs --cov madoop
